name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test all Python versions on Ubuntu, latest Python on Windows/macOS
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run linting (ruff)
      run: ruff check dsconv/

    - name: Check formatting (black)
      run: black --check dsconv/

    - name: Run type checking (mypy)
      run: mypy dsconv/
      continue-on-error: true

    - name: Run tests with coverage
      run: pytest

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

  validate-refactor:
    name: Validate Refactored vs Legacy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run validation (if test files available)
      run: |
        if [ -d "examples/test-ccis" ] && [ -n "$(ls -A examples/test-ccis/*.cci 2>/dev/null)" ]; then
          echo "Running validation on test CCI files..."
          python scripts/validate_refactor.py examples/test-ccis/*.cci -o validation_output
        else
          echo "No test CCI files found, skipping validation"
          echo "To enable validation, add .cci test files to examples/test-ccis/"
          mkdir -p validation_output
          echo "No test files available for validation" > validation_output/README.txt
        fi
      continue-on-error: true  # Don't fail CI if no fixtures or validation fails

    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: validation_output/
        retention-days: 30
