name: Scheduled Checks

permissions:
  contents: read

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install bandit safety

    - name: Run Bandit security scanner
      run: |
        bandit -r dsconv/ -f json -o bandit-report.json || true
        echo "Bandit scan completed"

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json || true
        echo "Safety check completed"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
      continue-on-error: true

    - name: Validate issue templates
      run: |
        echo "Checking issue template structure..."
        for file in .github/ISSUE_TEMPLATE/*.md; do
          if [ -f "$file" ]; then
            echo "✓ Found: $file"
          fi
        done

    - name: Check required docs exist
      run: |
        required_docs=(
          "README.md"
          "CONTRIBUTING.md"
          "agents.md"
          ".github/copilot-instructions.md"
          ".github/PULL_REQUEST_TEMPLATE.md"
        )
        missing=0
        for doc in "${required_docs[@]}"; do
          if [ -f "$doc" ]; then
            echo "✓ Found: $doc"
          else
            echo "✗ Missing: $doc"
            missing=1
          fi
        done
        exit $missing
